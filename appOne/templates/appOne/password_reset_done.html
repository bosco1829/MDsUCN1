<!doctype html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="utf-8">
    <title>Correo Enviado | MDsUCN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'appOne/css/login.css' %}">
</head>
<body>
    <div class="login-wrapper">
        <div class="blob-bg blob-1"></div>
        <div class="blob-bg blob-2"></div>

        <div class="login-container" style="max-width: 500px; min-height: auto; padding: 40px; text-align: center;">
            <div style="width: 100%;">
                <div style="font-size: 50px; color: var(--secondary); margin-bottom: 15px;">
                    <i class="ri-mail-check-line"></i>
                </div>
                <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 10px;">¡Correo enviado!</h2>
                <p style="color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 25px;">
                    Hemos enviado las instrucciones para restablecer tu contraseña a tu correo institucional. Revisa tu bandeja de entrada o la carpeta de spam.
                </p>
                <a href="{% url 'login' %}" class="btn-login" style="text-decoration: none; display: inline-flex;">
                    <span>Volver al Inicio de Sesión</span>
                    <i class="ri-arrow-right-line"></i>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
